[tool.ruff]
target-version = "py312"
line-length = 88
# Las migraciones las genera Django; no se editan ni se revisan a mano.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF"]
# Atributos de clase de Django/DRF (Meta.ordering, permission_classes...): falso positivo.
ignore = ["RUF012"]