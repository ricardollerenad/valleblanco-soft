#.github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: valleblanco
          POSTGRES_USER: valleblanco
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valleblanco -d valleblanco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_DB: valleblanco
      POSTGRES_USER: valleblanco
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check .
      - name: Formato
        run: ruff format --check .
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Tests con cobertura
        run: pytest --cov=apps --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env de prueba a partir de la plantilla
        run: cp .env.example .env
      - name: Validar docker-compose.yml y construir la imagen
        run: |
          docker compose config --quiet
          docker compose build backend
